name: Upscale founder portrait and logo

on:
  push:
    branches: [main]
    paths:
      - ".asset-upscale-trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upscale:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip asset upscale]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Resize and gently sharpen existing assets
        run: python scripts/upscale_brand_assets.py
      - name: Commit high-resolution assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/founder.webp public/images/kavach-logo.png
          if [ -f .asset-upscale-trigger ]; then
            rm .asset-upscale-trigger
            git add -u .asset-upscale-trigger
          fi
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "chore: upscale founder portrait and logo [skip asset upscale]"
            git push
          fi
