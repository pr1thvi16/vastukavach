name: Validate Kavach site

on:
  push:
    branches:
      - booking-permanent-fix
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit
        run: |
          npm audit --json > audit-report.json || true
          node -e "const r=require('./audit-report.json'); for (const [name,v] of Object.entries(r.vulnerabilities || {})) console.log([v.severity, name, v.range, (v.fixAvailable && typeof v.fixAvailable === 'object' ? v.fixAvailable.name + '@' + v.fixAvailable.version : v.fixAvailable)].join(' | ')); console.log('Totals:', JSON.stringify(r.metadata?.vulnerabilities || {}))"
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
